services:
  bor:
    container_name: bor
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HNSWLIB_NO_NATIVE=1
    env_file:
      - .env
    volumes:
      - ${CHROMA_DATA_PATH}:${CHROMA_DATA_DIR}
      - ${MEMGRAPH_DATA_PATH}:/var/lib/memgraph
      # Mount Obsidian vault for note processing
      - ${OBSIDIAN_VAULT_PATH}:${OBSIDIAN_VAULT_PATH}:ro
  memgraph:
    image: memgraph/memgraph-mage:1.15-memgraph-2.15
    container_name: memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    environment:
      - MEMGRAPH="--log-level=TRACE"
    volumes:
      - ${MEMGRAPH_DATA_PATH}:/var/lib/memgraph

volumes:
  chroma_data:
  mg_lib:
